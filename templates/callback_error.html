<!DOCTYPE html>
<html><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<style>
body{background:#0b0f13;color:#e2eaf2;font-family:monospace;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:20px}
.box{background:#111820;border:1px solid #ff4d6d;border-radius:12px;
  padding:24px;max-width:400px;text-align:center}
h2{color:#ff4d6d;margin-bottom:12px}
p{color:#6b8199;font-size:13px;margin-bottom:20px}
a{color:#00d8a4;text-decoration:none;font-size:14px;
  border:1px solid #00d8a4;padding:10px 20px;border-radius:8px;display:inline-block}
</style></head>
<body>
<div class="box">
  <h2>❌ Login Failed</h2>
  <p>{{ msg }}</p>
  <a href="/">← Try Again</a>
</div>
</body></html>
